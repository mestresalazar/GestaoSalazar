<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Salazar - Acesso Operacional</title>
    <!-- SUPORTE PWA PARA ANDROID -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#07090f">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
            letter-spacing: -0.01em;
        }
        body {
            background-image: linear-gradient(rgba(7, 9, 15, 0.82), rgba(7, 9, 15, 0.94)), url('/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #07090f;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .login-card {
            background: linear-gradient(145deg, rgba(15, 20, 31, 0.94), rgba(7, 9, 15, 0.98));
            backdrop-filter: blur(18px);
            padding: 28px 24px;
            border-radius: 20px;
            box-shadow: 0 12px 36px -4px rgba(0, 0, 0, 0.85), 0 0 20px rgba(239, 68, 68, 0.15);
            width: 100%;
            max-width: 410px;
            border: 1px solid rgba(239, 68, 68, 0.35);
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .tactical-gif-frame {
            width: 110px;
            height: 110px;
            margin: 0 auto 14px auto;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid #ef4444;
            box-shadow: 0 0 24px rgba(239, 68, 68, 0.4), inset 0 0 12px rgba(0,0,0,0.8);
            background: #07090f;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tactical-gif-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .login-card h2 {
            color: #ef4444;
            margin-bottom: 6px;
            font-size: 22px;
            font-weight: 800;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            letter-spacing: -0.02em;
        }
        .login-card p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            color: #ef4444;
            margin-bottom: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(15, 20, 31, 0.85);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .form-group input:focus {
            border-color: #ef4444;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.25s ease;
            box-shadow: 0 6px 18px rgba(239, 68, 68, 0.35);
        }
        .btn-submit:hover {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            transform: translateY(-2px);
        }
        .toggle-link {
            margin-top: 18px;
            display: block;
            font-size: 13px;
            color: #ef4444;
            cursor: pointer;
            text-decoration: underline;
            font-weight: 600;
        }
        .toggle-link:hover {
            color: #f87171;
        }
        #errorMsg {
            color: #f87171;
            font-size: 12px;
            margin-top: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- SPLASH SCREEN TÁTICA COM O GIF DA GLOCK -->
    <div id="splashScreen" style="position: fixed; inset: 0; background: #07090f; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; transition: opacity 0.4s ease, visibility 0.4s ease;">
        <div style="width: 140px; height: 140px; border-radius: 24px; overflow: hidden; border: 2px solid #ef4444; box-shadow: 0 0 30px rgba(239, 68, 68, 0.5); background: #07090f; margin-bottom: 20px; display: flex; align-items: center; justify-content: center;">
            <img src="/mac-glock.gif" alt="Salazar Glock" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.src='/icons/icon-192.png'">
        </div>
        <h2 style="color: #ef4444; font-size: 20px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;">Gestão Salazar</h2>
        <p style="color: #94a3b8; font-size: 11px; margin-top: 6px; letter-spacing: 1.5px; font-weight: 600;">CARREGANDO SISTEMA TÁTICO...</p>
    </div>

    <div class="login-card">
        <!-- MOLDURA TÁTICA DO GIF DA GLOCK -->
        <div class="tactical-gif-frame">
            <img src="/mac-glock.gif" alt="Salazar Glock" onerror="this.src='/icons/icon-192.png'">
        </div>

        <h2 id="cardTitle">Gestão Salazar</h2>
        <p id="cardSubtitle">Autenticação do Efetivo Operacional</p>

        <form id="authForm" onsubmit="handleAuth(event)">
            <div class="form-group">
                <label>Nickname (Jogo / Discord)</label>
                <input type="text" id="nickname" required placeholder="Digite o seu nickname...">
            </div>

            <div class="form-group">
                <label>Palavra-passe</label>
                <input type="password" id="password" required placeholder="Digite a sua palavra-passe...">
            </div>

            <button type="submit" class="btn-submit" id="btnSubmitText">Entrar no Sistema</button>
        </form>

        <span class="toggle-link" id="toggleModeBtn" onclick="alternarModo()">Não tem conta? Solicitar Registo</span>
        <div id="errorMsg"></div>
    </div>

    <!-- MODAL CUSTOMIZADO PARA ALERTAS FLUIDOS -->
    <div id="customModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.85); justify-content: center; align-items: center; z-index: 20000; backdrop-filter: blur(4px); padding: 16px;">
        <div style="background: linear-gradient(145deg, rgba(15, 23, 42, 0.96), rgba(7, 13, 22, 0.99)); width: 100%; max-width: 420px; border-radius: 16px; padding: 24px; border: 1px solid rgba(56, 189, 248, 0.4); text-align: center;">
            <h3 id="modalCustomTitle" style="color: #38bdf8; margin-bottom: 12px; font-size: 18px;">Gestão Salazar</h3>
            <p id="modalCustomMessage" style="color: #e2e8f0; font-size: 14px; margin-bottom: 22px; line-height: 1.5;"></p>
            <button onclick="document.getElementById('customModal').style.display='none'" style="padding: 8px 25px; background: rgba(22, 163, 74, 0.9); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">OK</button>
        </div>
    </div>

    <script>
        // Oculta a splash screen com fade suave assim que carregar
        window.addEventListener('load', () => {
            const splash = document.getElementById('splashScreen');
            if (splash) {
                setTimeout(() => {
                    splash.style.opacity = '0';
                    splash.style.visibility = 'hidden';
                }, 350);
            }
        });

        let isRegisterMode = false;

        function alternarModo() {
            isRegisterMode = !isRegisterMode;
            const title = document.getElementById('cardTitle');
            const subtitle = document.getElementById('cardSubtitle');
            const btn = document.getElementById('btnSubmitText');
            const toggleBtn = document.getElementById('toggleModeBtn');
            const err = document.getElementById('errorMsg');
            err.innerText = '';

            if (isRegisterMode) {
                title.innerText = 'Novo Operacional';
                subtitle.innerText = 'Registo para aprovação do Comando';
                btn.innerText = 'Solicitar Registo';
                toggleBtn.innerText = 'Já tem conta? Fazer Login';
            } else {
                title.innerText = 'Gestão Salazar';
                subtitle.innerText = 'Autenticação do Efetivo Operacional';
                btn.innerText = 'Entrar no Sistema';
                toggleBtn.innerText = 'Não tem conta? Solicitar Registo';
            }
        }

        function mostrarModalCustomizado(titulo, mensagem) {
            document.getElementById('modalCustomTitle').innerText = titulo;
            document.getElementById('modalCustomMessage').innerHTML = mensagem;
            document.getElementById('customModal').style.display = 'flex';
        }

        async function handleAuth(event) {
            event.preventDefault();
            const nickname = document.getElementById('nickname').value.trim();
            const password = document.getElementById('password').value.trim();
            const err = document.getElementById('errorMsg');
            err.innerText = '';

            const endpoint = isRegisterMode ? '/api/auth/register' : '/api/auth/login';

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    if (isRegisterMode) {
                        mostrarModalCustomizado('Registo Solicitado', 'Registo solicitado com sucesso! Aguarde a aprovação do Comando.');
                        alternarModo();
                    } else {
                        localStorage.setItem('user', JSON.stringify(data.user));
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    err.innerText = data.message || 'Erro na autenticação.';
                }
            } catch (error) {
                console.error(error);
                err.innerText = 'Erro de conexão com o servidor.';
            }
        }
    </script>
</body>
</html>
