<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Salazar - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-image: linear-gradient(rgba(11, 19, 30, 0.3), rgba(11, 19, 30, 0.3)), url('/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #0b131e;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            background-color: rgba(18, 31, 51, 0.45);
            backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            text-align: center;
        }
        .login-card h2 {
            color: #38bdf8;
            margin-bottom: 5px;
            font-size: 24px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .login-card p {
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 25px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #e2e8f0;
            margin-bottom: 6px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 6px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #38bdf8;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: rgba(2, 132, 199, 0.9);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .btn-submit:hover {
            background-color: #0284c7;
        }
        .register-link {
            display: block;
            margin-top: 20px;
            font-size: 13px;
            color: #38bdf8;
            text-decoration: none;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .register-link:hover {
            text-decoration: underline;
        }
        .btn-action {
            padding: 8px 25px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            background-color: rgba(22, 163, 74, 0.9);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .btn-action:hover { opacity: 0.85; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Gestão Salazar</h2>
        <p>Painel Operacional Restrito</p>
        
        <form id="loginForm" onsubmit="fazerLogin(event)">
            <div class="form-group">
                <label>Nickname</label>
                <input type="text" id="nickname" required placeholder="Digite seu nickname...">
            </div>
            
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">Entrar no Sistema</button>
        </form>

        <a href="register.html" class="register-link">Não tem conta? Cadastre-se</a>
    </div>

    <!-- Modal Profissional para Substituir Alertas Nativos -->
    <div id="customModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); justify-content: center; align-items: center; z-index: 9999; backdrop-filter: blur(4px);">
        <div style="background: rgba(18, 31, 51, 0.95); width: 90%; max-width: 400px; border-radius: 8px; padding: 25px; box-shadow: 0 4px 25px rgba(0,0,0,0.9); border: 1px solid #38bdf8; text-align: center;">
            <h3 id="modalCustomTitle" style="color: #38bdf8; margin-bottom: 12px; font-size: 18px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">Gestão Salazar</h3>
            <p id="modalCustomMessage" style="color: #e2e8f0; font-size: 14px; margin-bottom: 20px; line-height: 1.4; text-shadow: 0 1px 2px rgba(0,0,0,0.8);"></p>
            <div id="modalCustomButtons" style="display: flex; gap: 10px; justify-content: center;"></div>
        </div>
    </div>

    <script>
        function mostrarModalCustomizado(titulo, mensagem, callback = null) {
            const modal = document.getElementById('customModal');
            document.getElementById('modalCustomTitle').innerText = titulo;
            document.getElementById('modalCustomMessage').innerHTML = mensagem;
            const btnContainer = document.getElementById('modalCustomButtons');
            btnContainer.innerHTML = '';

            const btnOk = document.createElement('button');
            btnOk.innerText = 'OK';
            btnOk.className = 'btn-action';
            btnOk.onclick = () => {
                modal.style.display = 'none';
                if (callback) callback();
            };
            btnContainer.appendChild(btnOk);
            modal.style.display = 'flex';
        }

        async function fazerLogin(event) {
            event.preventDefault();
            const nickname = document.getElementById('nickname').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname, password })
                });

                const data = await response.json();
                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    mostrarModalCustomizado('Sucesso', 'Login realizado com sucesso!', () => {
                        window.location.href = 'dashboard.html';
                    });
                } else {
                    mostrarModalCustomizado('Erro de Autenticação', data.message || 'Erro ao realizar login.');
                }
            } catch (e) {
                console.error(e);
                mostrarModalCustomizado('Erro', 'Erro de conexão com o servidor.');
            }
        }
    </script>
</body>
</html>
