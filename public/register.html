<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão Salazar - Registo de Membro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-image: linear-gradient(rgba(11, 19, 30, 0.25), rgba(11, 19, 30, 0.25)), url('/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #0b131e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .register-container {
            background-color: rgba(18, 31, 51, 0.45);
            backdrop-filter: blur(8px);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(56, 189, 248, 0.25);
        }
        h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #38bdf8;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        p {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 24px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 13px;
            color: #e2e8f0;
            margin-bottom: 8px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: rgba(22, 163, 74, 0.9);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        button:hover {
            background-color: #15803d;
        }
        .footer-link {
            margin-top: 20px;
            display: block;
            font-size: 13px;
            color: #38bdf8;
            text-decoration: none;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .footer-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>Gestão Salazar</h2>
        <p>Registo de Novo Membro</p>

        <form id="registerForm">
            <div class="form-group">
                <label for="nickname">Nickname</label>
                <input type="text" id="nickname" required placeholder="Seu nick no jogo">
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="Crie sua senha">
            </div>

            <button type="submit">Cadastrar Conta</button>
        </form>

        <a href="index.html" class="footer-link">Já tem uma conta? Faça login</a>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const nickname = document.getElementById('nickname').value.trim();
            const password = document.getElementById('senha').value;

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    alert('Conta criada com sucesso! Aguarde aprovação do comando para aceder.');
                    window.location.href = 'index.html';
                } else {
                    alert(data.message || 'Erro ao realizar registo.');
                }
            } catch (error) {
                console.error('Erro na requisição:', error);
                alert('Erro de conexão com o servidor.');
            }
        });
    </script>
</body>
</html>
